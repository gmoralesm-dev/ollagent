[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ollagent"
version = "0.4.0"
description = "A local terminal coding agent for your own Ollama models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gabriel Morales", email = "cazgenius@gmail.com" }]
keywords = ["ollama", "agent", "cli", "llm", "coding", "local", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/gmoralesm-dev/ollagent"
Repository = "https://github.com/gmoralesm-dev/ollagent"
Issues = "https://github.com/gmoralesm-dev/ollagent/issues"

[project.scripts]
ollagent = "ollagent.cli:main"

[tool.setuptools]
packages = ["ollagent"]
